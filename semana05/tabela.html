<body>
    <header>
        <nav>
            <a href="#">Página Inicial</a>

        <main>

                    <tr>
                        <th rowspan="2">Sul</th>

                    <tr>
                        <td>Santa Catarina</td>

                    </tr>
                    <tr>
                        <td>Acre</td>

                    </tr>
                    <tr>
                        <Td>Rondonia</Td>
                        <td>10-7</td>

                    </tr>

                    <tr>
                        <th colspan="3">Total de Jogadores</th>

                    </tr>

                </tfoot>
                </tr>
